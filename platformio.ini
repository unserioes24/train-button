; Train Button — ESP32-S3 Mini
; https://github.com/unserioes24/train-button

[env:esp32-s3-mini]
platform  = espressif32@^6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size      = 4MB
board_build.partitions       = huge_app.csv   ; 3 MB app slot, no OTA
board_build.arduino.memory_type = qio_qspi   ; no octal PSRAM — keeps GPIO 33-37 free

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder
upload_speed   = 921600

build_flags =
  -DARDUINO_USB_MODE=1          ; native USB, the board has no UART bridge
  -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial goes to the USB-C port
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  bblanchon/ArduinoJson@^7.2.1
